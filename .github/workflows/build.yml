name: Build Feurstagram

on:
  workflow_dispatch:
    inputs:
      apk_tag:
        description: "Tag de la release de ton fork qui contient instagram.apk"
        required: true
        default: "instagram-base"
      clone:
        description: "Installer à côté d'Instagram officiel (--clone)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Gradle credentials (patcher dependency)
        env:
          GPR_USER: ${{ github.repository_owner }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
        run: |
          mkdir -p ~/.gradle
          {
            echo "gpr.user=${GPR_USER}"
            echo "gpr.key=${GPR_TOKEN}"
          } >> ~/.gradle/gradle.properties

      - name: Download Instagram bundle and merge into one APK
        env:
          GH_TOKEN: ${{ github.token }}
          APK_TAG: ${{ inputs.apk_tag }}
        run: |
          mkdir -p bundle apkeditor
          gh release download "$APK_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.apkm" --pattern "*.xapk" --pattern "*.apks" \
            --dir bundle --clobber
          ls -lh bundle
          gh release download \
            --repo REAndroid/APKEditor \
            --pattern "APKEditor-*.jar" \
            --dir apkeditor --clobber
          java -jar apkeditor/APKEditor-*.jar m -i "$(ls bundle/* | head -n1)" -o instagram.apk -f
          ls -lh instagram.apk
      - name: Download Morphe CLI from your release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_TAG: ${{ inputs.apk_tag }}
        run: |
          echo "Assets de la release $APK_TAG :"
          gh release view "$APK_TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
          mkdir -p tools
          gh release download "$APK_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.jar" \
            --dir tools \
            --clobber
          ls -lh tools
      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.FEURSTAGRAM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > feurstagram.keystore
            echo "Keystore restauré"
          fi
      - name: Build and patch
        env:
          FEURSTAGRAM_KEYSTORE_PASS: ${{ secrets.FEURSTAGRAM_KEYSTORE_PASS }}
          FEURSTAGRAM_KEY_PASS: ${{ secrets.FEURSTAGRAM_KEY_PASS }}
          CLONE: ${{ inputs.clone }}
        run: |
          chmod +x build.sh
          # Sans secret, on retire les variables pour que build.sh génère une clé jetable
          if [ -z "$FEURSTAGRAM_KEYSTORE_PASS" ]; then
            unset FEURSTAGRAM_KEYSTORE_PASS FEURSTAGRAM_KEY_PASS
          fi
          if [ -z "$FEURSTAGRAM_KEY_PASS" ]; then
            unset FEURSTAGRAM_KEY_PASS
          fi
          if [ "$CLONE" = "true" ]; then
            ./build.sh instagram.apk --clone
          else
            ./build.sh instagram.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: feurstagram-apk
          path: feurstagram.apk
          retention-days: 14
          if-no-files-found: error
